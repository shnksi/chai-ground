[project]
name = "chai-ground"
version = "0.1.0"
description = "Grounded input preparation, pre-flight restraint validation, and output-honesty auditing for Chai-1 (chai-lab), with a preregistered agent failure-mode eval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
eval = ["anthropic>=0.40,<3"]

[project.scripts]
chai-ground-mcp = "chai_ground.server:main"
chai-ground-eval = "chai_ground.eval.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chai_ground"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
